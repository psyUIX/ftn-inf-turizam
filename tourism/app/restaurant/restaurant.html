<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourApp - Restorani</title>
    <link rel="stylesheet" href="../../dist/styles.css">
    <link rel="stylesheet" href="../../dist/restaurant/restaurant.css">
</head>
<body>
    <nav class="navbar">
        <h1 class="title">TourApp</h1>
        <ul class="nav-links">
            <li><a href="../contact/contact.html">Kontakt</a></li>
            <li><a href="../tour/tour.html">Ture</a></li>
            <li><a href="#">Restorani</a></li>
        </ul>
    </nav>

    <div class="page-content">
        <div class="left-panel">
            <h2 class="section-title">Pregled restorana</h2>
            <table id="restaurants">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Naziv</th>
                        <th>Kuhinja</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <div id="restaurant-details" class="details-box" style="display:none;"></div>
        </div>

        <div class="right-panel">
            <h2 class="section-title">Dodaj restoran</h2>
            <form id="form">
                <div class="form-group">
                    <label for="naziv">Naziv:</label>
                    <input type="text" id="naziv" name="naziv" placeholder="Unesite naziv" required>
                </div>
                <div class="form-group">
                    <label for="opis">Opis:</label>
                    <input type="text" id="opis" name="opis" placeholder="Unesite opis" required>
                </div>
                <div class="form-group">
                    <label>Kuhinja:</label>
                    <div class="cuisine-container" id="cuisineContainer">
                        <div class="cuisine-input">
                            <input type="text" name="cuisines" placeholder="Unesite kuhinju">
                            <button type="button" onclick="addCuisineField()">+</button>
                        </div>
                    </div>
                </div>
                <button type="button" id="submitBtn" class="btn-add">Dodaj</button>
            </form>
        </div>
    </div>

    <script src="restaurant.js"></script>
</body>
</html>
